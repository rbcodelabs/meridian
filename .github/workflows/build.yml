name: Build & Release

on:
  # Manual trigger — pick a version tag in the UI
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

  # Auto-build on version tags pushed to main
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        # Ensure we use a modern Xcode with Swift 5.9+
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build (release)
        run: ./build-app.sh release

      - name: Set version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Zip app bundle
        run: |
          cd build
          ditto -c -k --keepParent "Meridian.app" \
            "Bankrate-Meridian-${{ env.VERSION }}.zip"

      # ── Quarantine note ──────────────────────────────────────────────────────
      # The binary is unsigned. Recipients must right-click → Open on first
      # launch, or run:  xattr -cr "Meridian.app"
      # To add Developer ID signing, store your cert + password as repository
      # secrets (MACOS_CERTIFICATE / MACOS_CERTIFICATE_PWD) and add a
      # codesign step before the zip step.
      # ────────────────────────────────────────────────────────────────────────

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "Bankrate Meridian ${{ env.VERSION }}"
          body: |
            ## Install

            1. Download and unzip `Bankrate-Meridian-${{ env.VERSION }}.zip`
            2. Drag **Meridian.app** to `/Applications`
            3. **First launch:** right-click → Open (unsigned binary — only needed once)

            ## What's in this release

            - Installs Homebrew, Claude Code, GitHub CLI, and Google Workspace CLI
            - Pre-configured for Bankrate (Keeper auth, bankrate.com email domain)
            - Clones the `bankrate-vault` starter vault into Obsidian
          files: build/Bankrate-Meridian-${{ env.VERSION }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
