name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build (release)
        run: ./build-app.sh release

      - name: Set version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Ad-hoc sign so generate_appcast's code signing check passes.
      # This doesn't satisfy Gatekeeper — first launch still needs right-click → Open.
      - name: Ad-hoc sign app bundle
        run: codesign --sign - --force --deep build/Meridian.app

      - name: Zip app bundle
        run: |
          cd build
          ditto -c -k --keepParent "Meridian.app" "Meridian-${{ env.VERSION }}.zip"

      # ── Sign the zip and generate appcast.xml ───────────────────────────────
      - name: Download Sparkle tools
        run: |
          curl -Lso sparkle.tar.xz \
            https://github.com/sparkle-project/Sparkle/releases/download/2.9.2/Sparkle-2.9.2.tar.xz
          mkdir sparkle-tools && tar xf sparkle.tar.xz -C sparkle-tools

      - name: Generate appcast.xml
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_key
          ./sparkle-tools/bin/generate_appcast \
            --ed-key-file /tmp/sparkle_key \
            --download-url-prefix "https://github.com/rbcodelabs/meridian/releases/download/${{ env.VERSION }}/" \
            --link "https://github.com/rbcodelabs/meridian" \
            build/
          rm /tmp/sparkle_key

      # ── Publish appcast to GitHub Pages ─────────────────────────────────────
      - name: Deploy appcast to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: build/
          keep_files: true

      # ── Create GitHub Release ────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "Meridian ${{ env.VERSION }}"
          body: |
            ## Install

            1. Download and unzip `Meridian-${{ env.VERSION }}.zip`
            2. Drag **Meridian.app** to `/Applications`
            3. **First launch:** right-click → Open (unsigned binary — only needed once)

            Existing installs will be notified automatically via the in-app updater.
          files: build/Meridian-${{ env.VERSION }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
