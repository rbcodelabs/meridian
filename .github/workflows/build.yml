name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build (release)
        run: ./build-app.sh release

      - name: Set version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Zip app bundle
        run: |
          cd build
          ditto -c -k --keepParent "Meridian.app" "Bankrate-Meridian-${{ env.VERSION }}.zip"

      # ── Sign and generate appcast ────────────────────────────────────────────
      - name: Download Sparkle tools
        run: |
          curl -Lso sparkle.tar.xz \
            https://github.com/sparkle-project/Sparkle/releases/download/2.6.4/Sparkle-2.6.4.tar.xz
          mkdir sparkle-tools && tar xf sparkle.tar.xz -C sparkle-tools

      - name: Generate appcast.xml
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_key
          ./sparkle-tools/bin/generate_appcast \
            --ed-key-file /tmp/sparkle_key \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/" \
            --link "https://github.com/${{ github.repository }}" \
            build/
          rm /tmp/sparkle_key

      # ── Publish appcast to the PUBLIC meridian Pages site ────────────────────
      # The bankrate-meridian repo may be private so we publish the appcast to
      # the public rbcodelabs/meridian gh-pages branch under bankrate/.
      # This avoids needing a paid GitHub plan for Pages on a private repo.
      - name: Deploy appcast to meridian Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.MERIDIAN_PAGES_TOKEN }}
          external_repository: rbcodelabs/meridian
          publish_branch: gh-pages
          publish_dir: build/
          destination_dir: bankrate
          include_files: appcast.xml
          keep_files: true

      # ── Create GitHub Release ────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "Bankrate Meridian ${{ env.VERSION }}"
          body: |
            ## Install

            1. Download and unzip `Bankrate-Meridian-${{ env.VERSION }}.zip`
            2. Drag **Meridian.app** to `/Applications`
            3. **First launch:** right-click → Open (unsigned binary — only needed once)

            Existing installs will be notified automatically via the in-app updater.
          files: build/Bankrate-Meridian-${{ env.VERSION }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
