<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <!-- Gem face gradients -->
    <linearGradient id="gemTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gemLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4c1d95;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gemRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gemBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5b21b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e1065;stop-opacity:1" />
    </linearGradient>
    <!-- Spark/circuit glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Clip path so everything outside the rounded rect is transparent -->
  <defs>
    <clipPath id="roundedClip">
      <rect width="1024" height="1024" rx="220" ry="220"/>
    </clipPath>
  </defs>

  <!-- Everything inside this group is clipped to the rounded rect -->
  <g clip-path="url(#roundedClip)">
    <rect width="1024" height="1024" fill="url(#bgGrad)"/>

    <!-- Subtle radial glow behind gem -->
  <ellipse cx="512" cy="500" rx="280" ry="260" fill="#7c3aed" opacity="0.15"/>

  <!-- GEM SHAPE — Obsidian-style faceted crystal -->
  <!-- Gem center point: 512, 500. Top: 512,180. Bottom: 512,790 -->

  <!-- Top-left face -->
  <polygon points="512,180 310,400 512,460" fill="url(#gemTop)" opacity="0.95"/>
  <!-- Top-right face -->
  <polygon points="512,180 714,400 512,460" fill="url(#gemRight)" opacity="0.9"/>
  <!-- Left face -->
  <polygon points="310,400 512,460 512,790" fill="url(#gemLeft)" opacity="0.95"/>
  <!-- Right face -->
  <polygon points="714,400 512,460 512,790" fill="url(#gemBottom)" opacity="0.9"/>

  <!-- Inner highlight edge (top ridge) -->
  <line x1="512" y1="180" x2="512" y2="460" stroke="#e9d5ff" stroke-width="2.5" opacity="0.6"/>
  <!-- Horizontal belt line -->
  <line x1="310" y1="400" x2="714" y2="400" stroke="#c084fc" stroke-width="1.5" opacity="0.35"/>

  <!-- Gem outline for crispness -->
  <polygon points="512,180 714,400 512,790 310,400" fill="none" stroke="#d8b4fe" stroke-width="2" opacity="0.4"/>

  <!-- CIRCUIT / SPARK details — subtle AI motif -->
  <!-- Small circuit nodes emanating from gem corners -->

  <!-- Top node -->
  <circle cx="512" cy="148" r="7" fill="#e879f9" filter="url(#glow)" opacity="0.9"/>
  <line x1="512" y1="155" x2="512" y2="180" stroke="#e879f9" stroke-width="2" opacity="0.6"/>

  <!-- Left node -->
  <circle cx="272" cy="400" r="7" fill="#818cf8" filter="url(#glow)" opacity="0.9"/>
  <line x1="279" y1="400" x2="310" y2="400" stroke="#818cf8" stroke-width="2" opacity="0.6"/>
  <!-- Left branch -->
  <line x1="272" y1="400" x2="240" y2="368" stroke="#818cf8" stroke-width="1.5" opacity="0.4"/>
  <circle cx="240" cy="368" r="4" fill="#818cf8" opacity="0.6"/>
  <line x1="272" y1="400" x2="240" y2="432" stroke="#818cf8" stroke-width="1.5" opacity="0.4"/>
  <circle cx="240" cy="432" r="4" fill="#818cf8" opacity="0.6"/>

  <!-- Right node -->
  <circle cx="752" cy="400" r="7" fill="#818cf8" filter="url(#glow)" opacity="0.9"/>
  <line x1="714" y1="400" x2="745" y2="400" stroke="#818cf8" stroke-width="2" opacity="0.6"/>
  <!-- Right branch -->
  <line x1="752" y1="400" x2="784" y2="368" stroke="#818cf8" stroke-width="1.5" opacity="0.4"/>
  <circle cx="784" cy="368" r="4" fill="#818cf8" opacity="0.6"/>
  <line x1="752" y1="400" x2="784" y2="432" stroke="#818cf8" stroke-width="1.5" opacity="0.4"/>
  <circle cx="784" cy="432" r="4" fill="#818cf8" opacity="0.6"/>

  <!-- Bottom node -->
  <circle cx="512" cy="826" r="7" fill="#e879f9" filter="url(#glow)" opacity="0.9"/>
  <line x1="512" y1="790" x2="512" y2="819" stroke="#e879f9" stroke-width="2" opacity="0.6"/>

  <!-- Top-left sparkle -->
  <g filter="url(#glow)" opacity="0.7">
    <line x1="340" y1="230" x2="340" y2="210" stroke="#f0abfc" stroke-width="2"/>
    <line x1="330" y1="220" x2="350" y2="220" stroke="#f0abfc" stroke-width="2"/>
    <line x1="333" y1="213" x2="347" y2="227" stroke="#f0abfc" stroke-width="1.5"/>
    <line x1="347" y1="213" x2="333" y2="227" stroke="#f0abfc" stroke-width="1.5"/>
  </g>

  <!-- Top-right sparkle (smaller) -->
  <g filter="url(#glow)" opacity="0.5">
    <line x1="680" y1="260" x2="680" y2="246" stroke="#c4b5fd" stroke-width="1.5"/>
    <line x1="673" y1="253" x2="687" y2="253" stroke="#c4b5fd" stroke-width="1.5"/>
  </g>

  <!-- Top face highlight sheen -->
  <polygon points="512,188 590,330 512,360 434,330" fill="white" opacity="0.07"/>

  </g><!-- end rounded clip group -->

</svg>
